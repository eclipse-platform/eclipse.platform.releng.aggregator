# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: /cje-production/dockerfiles/centos-gtk4-mutter/9-gtk4
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /cje-production/dockerfiles/opensuse-gtk3-metacity/16-gtk3
    schedule:
      interval: daily

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    exclude-paths:
      # Submodules, which can't be updated from this repository
      - eclipse.jdt
      - eclipse.jdt.core
      - eclipse.jdt.core.binaries
      - eclipse.jdt.debug
      - eclipse.jdt.ui
      - eclipse.pde
      - eclipse.platform
      - eclipse.platform.swt
      - eclipse.platform.ui
      - equinox
      - equinox.p2
      # In-repo modules aggregating pomless Tycho modules, which Dependabot cannot fetch.
      # They declare no versions of their own, all come from eclipse-platform-parent.
      - eclipse.platform.common
      - eclipse.platform.releng
      - products
      - sites
    groups:
      tycho:
        patterns:
          - "org.eclipse.tycho*"
          - "tycho-version"
